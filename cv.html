<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV - Pinghui Wu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #1a1a1a;
            background: #f0f0f0;
            font-size: 16px;
        }

        nav {
            background: transparent;
            border-bottom: none;
            padding: 2rem 0 1rem 0;
            margin-bottom: 3rem;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
        }

        .nav-title a {
            color: #333;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2.5rem;
        }

        .nav-links a {
            color: #333;
            text-decoration: none;
            font-size: 1rem;
            transition: color 0.2s;
            padding-bottom: 2px;
            border-bottom: 2px solid transparent;
        }

        .nav-links a:hover,
        .nav-links a.active {
            border-bottom-color: #5b21b6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 2rem 4rem 2rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 400;
            margin-bottom: 3rem;
            color: #1a1a1a;
        }

        .content-block {
            background: #ffffff;
            padding: 2.5rem 3rem;
            margin-bottom: 2.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        h2 {
            font-size: 1.4rem;
            font-weight: 500;
            margin-bottom: 1rem;
            margin-top: 1.5rem;
            color: #1a1a1a;
        }

        h2:first-child {
            margin-top: 0;
        }

        h3 {
            font-size: 1.1rem;
            font-weight: 500;
            margin-top: 1.25rem;
            margin-bottom: 0.75rem;
            color: #1a1a1a;
        }

        p {
            margin-bottom: 1rem;
            line-height: 1.7;
        }

        .btn {
            display: inline-block;
            padding: 0.6rem 1.2rem;
            background: #1e6bb8;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background 0.3s;
            margin-top: 1rem;
        }

        .btn:hover {
            background: #155a9a;
        }

        footer {
            background: transparent;
            border-top: none;
            padding: 2rem 0;
            margin-top: 4rem;
            text-align: center;
        }

        .footer-content {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 2rem;
            color: #666;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                gap: 1rem;
            }

            .nav-links {
                gap: 1.5rem;
                font-size: 0.9rem;
            }

            .container {
                padding: 0 1.5rem 3rem 1.5rem;
            }

            .content-block {
                padding: 2rem 1.5rem;
            }

            h1 {
                font-size: 1.85rem;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="nav-title"><a href="index.html">Pinghui Wu</a></div>
            <ul class="nav-links">
                <li><a href="index.html">About</a></li>
                <li><a href="research.html">Research</a></li>
                <li><a href="policy.html">Policy Work</a></li>
                <li><a href="cv.html" class="active">CV</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <h1>Curriculum Vitae</h1>

        <div class="content-block">
            <div>
                <a href="CV_Wu.pdf" class="btn" download>Download Full CV (PDF)</a>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            &copy; 2026 Pinghui Wu. All rights reserved.
        </div>
    </footer>

    <script data-goatcounter="https://olivefield.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
</body>
</html>
